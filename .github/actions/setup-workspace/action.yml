name: Set up workspace
description: Install pnpm and Node from the repository pins, then install the dependencies. Run actions/checkout first.

runs:
  using: composite
  steps:
    # Bootstrap with pinned Node before pnpm uses npm on a self-hosted runner.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        package-manager-cache: false
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        run_install: false
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
