name: Install gitleaks
description: Download the pinned gitleaks release, check its SHA-256 and add it to PATH.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        GITLEAKS_VERSION=8.30.1
        # RUNNER_TEMP, not /tmp and /usr/local/bin: a self-hosted runner is not
        # root, and its jobs can run side by side on one host.
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          -o "$RUNNER_TEMP/gitleaks.tar.gz"
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
        tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/gitleaks" version
