# Keeps the SHA-pinned actions in .github/workflows/ and .github/actions/ and
# the npm lockfiles maintained.
#
# Pinning to a commit SHA is what stops a moving major tag from silently
# changing what runs in CI, but it also means nothing updates on its own —
# including security fixes. Dependabot rewrites the pin and its trailing
# version comment together, which is the only reason SHA pinning is
# sustainable here. Lockfiles pin the same way: without these updates, a
# dependency changes only when someone runs pnpm or npm by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      # The pinned pnpm and Node setup actions live in this composite action.
      - /.github/actions/setup-workspace
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"

  # The pnpm workspace. The npm ecosystem reads pnpm-lock.yaml and the
  # packages listed in pnpm-workspace.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
