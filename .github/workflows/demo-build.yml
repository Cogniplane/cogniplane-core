name: Demo build

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-build-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'Cogniplane/cogniplane-core' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    env:
      BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_SHA }}
          persist-credentials: false
      - name: Find successful main CI for this exact commit
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$BUILD_SHA&branch=main&event=push&status=success&per_page=100" --jq '.workflow_runs[0].id // empty')
          test -n "$run_id" || { echo 'No successful main CI for this commit'; exit 1; }
          echo "SOURCE_CI_RUN_ID=$run_id" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-workspace
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set build date
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/backend.Dockerfile
          load: true
          push: false
          tags: cogniplane-backend:qa-${{ env.BUILD_SHA }}
          build-args: |
            BUILD_SHA=${{ env.BUILD_SHA }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build demo Workers
        run: |
          pnpm --filter @cogniplane/shared-types build
          pnpm --filter @cogniplane/frontend cf:build
          pnpm test:frontend-worker
        env:
          NEXT_PUBLIC_API_URL: https://api-demo.cogniplane.io
          NEXT_PUBLIC_MCP_APP_SANDBOX_ORIGIN: https://mcp-app-sandbox.demo.cogniplane.io
          NEXT_PUBLIC_BUILD_SHA: ${{ env.BUILD_SHA }}
          NEXT_PUBLIC_BUILD_DATE: ${{ env.BUILD_DATE }}
      - name: Package exact-commit outputs
        run: bash scripts/package-demo-release.sh "$RUNNER_TEMP/demo-release"
      - name: Publish build outputs
        run: |
          gh release create "demo-build-$BUILD_SHA" \
            --repo "$GITHUB_REPOSITORY" --target "$BUILD_SHA" \
            --title "Demo build $BUILD_SHA" --prerelease \
            --notes "Product outputs from main CI $SOURCE_CI_RUN_ID and build run $GITHUB_RUN_ID. Deployment is controlled separately." \
            "$RUNNER_TEMP/demo-release/backend.tar.gz" \
            "$RUNNER_TEMP/demo-release/workers.tar.gz" \
            "$RUNNER_TEMP/demo-release/manifest.json"
