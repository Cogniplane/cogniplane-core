name: Docker images

# Check both self-hosting images on pull requests and pushes to main.
# Build failures block this workflow; no deployment runs from it.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  # One image build per ref. A newer push makes an in-flight build obsolete.
  group: docker-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build:
    name: Docker images build
    runs-on: ubuntu-24.04
    # Longer than the ci.yml gating jobs: two image builds with a remote cache.
    timeout-minutes: 40
    # Build both images to catch workspace or packaging changes.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # Limit builder RAM and allow disk swap for cold builds on VM207.
          driver-opts: |
            ${{ runner.environment == 'self-hosted' && 'memory=6g' || '' }}
            ${{ runner.environment == 'self-hosted' && 'memory-swap=8g' || '' }}
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          load: false
          tags: cogniplane-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          load: false
          tags: cogniplane-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
