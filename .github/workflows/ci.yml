name: CI

# Product checks for pushes to main and pull requests.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least privilege: every job here only reads the repo. Jobs that need more
# must opt in explicitly at the job level.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    if: ${{ !cancelled() }}
    needs: [frontend-build, dependency-audit, gitleaks, lint, typecheck, test, integration, license-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every product check to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          jobs = json.loads(os.environ["JOB_RESULTS"])
          failed = {name: job["result"] for name, job in jobs.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Product checks did not all pass: {failed}")
          PY

  frontend-build:
    name: Cloudflare frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm --filter @cogniplane/shared-types build
      - run: pnpm --filter @cogniplane/frontend cf:build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_MCP_APP_SANDBOX_ORIGIN: https://sandbox.example.com
      - run: pnpm test:frontend-worker
      - run: pnpm --filter @cogniplane/frontend sandbox:typecheck
      - run: pnpm --filter @cogniplane/frontend sandbox:test
      - run: pnpm exec eslint sandbox-worker/worker.ts sandbox-worker/worker.test.ts
        working-directory: apps/frontend
      - run: pnpm exec wrangler types sandbox-worker/worker-env.d.ts --config wrangler.sandbox.jsonc --include-runtime false --env-file /dev/null --check
        working-directory: apps/frontend
      - run: pnpm exec wrangler deploy --config wrangler.sandbox.jsonc --env-file /dev/null --dry-run
        working-directory: apps/frontend

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependencies are installed, so no pnpm store is cached.
          package-manager-cache: false
      # Install pnpm with the pinned Node, not the runner's bundled npm.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
      # NOT `--prod`. At the workspace root that resolution reported 0
      # vulnerabilities while the full audit found 4, including a high-severity
      # lodash-es code-injection advisory reached through
      # @copilotkit/react-core, a shipped frontend dependency. Dev-only
      # advisories count too: the @vitest/mocker path traversal below 4.1.11
      # also went unseen here.
      - run: pnpm audit

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the scan covers every commit, not just HEAD.
          fetch-depth: 0
      # Run the open-source gitleaks CLI directly (MIT, free for any repo).
      # We deliberately do NOT use gitleaks/gitleaks-action@v2: that wrapper
      # requires a paid GITLEAKS_LICENSE for any org-owned repo (public or
      # private). The CLI has no such gate.
      - name: Install gitleaks
        uses: ./.github/actions/install-gitleaks
      - name: Scan for secrets
        run: gitleaks detect --config .gitleaks.toml --log-opts='--all' --no-banner --redact

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  test:
    name: Test + Coverage
    runs-on: ubuntu-24.04
    # The full pass took 34 minutes on 2026-11-01. Allow room for runner variance.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      # Package coverage commands run all backend and frontend unit tests and
      # enforce their full-source floors. Run the other workspace projects here
      # so each unit suite runs once. Postgres tests have their own job.
      - name: Workspace tests without a coverage gate
        run: pnpm test:all --project='!backend' --project='!frontend' --project='!backend-integration'
      - name: Backend full-source coverage
        run: pnpm test:coverage
      - name: Frontend full-source coverage
        run: pnpm test:coverage:frontend
      # Imported-module coverage remains available through the :imported
      # commands. It adds no test cases and changes when imports change, so it
      # does not need another run of both suites on every PR.

  integration:
    name: Integration (Postgres RLS)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The first tests in this repo that touch a real database. Row-Level
    # Security is the tenant-isolation boundary for every request path, and the
    # unit suite cannot execute a policy: `test-helpers/fake-pool.ts` answers
    # BEGIN/COMMIT/set_config well enough that `withTenantScope` works against
    # it, so a table with no ENABLE ROW LEVEL SECURITY, a policy naming the
    # wrong GUC, or a store method skipping `withTenantScope` on a tested path all pass
    # unit tests silently. This job is what catches those.
    #
    # Its own job, not a step in `test`, for three reasons: it needs Postgres
    # and Redis service containers; it keeps the `test` job's runtime
    # unchanged; and it fails independently, so a dependency failure reads as
    # "integration red" rather than "tests red".
    #
    # What it does NOT prove: it catches a missing `withTenantScope` only in the
    # store methods it explicitly tests, not in arbitrary new code. Its
    # row-visibility cases cover every tenant table through its production
    # write path, except the one exception that rls-write-paths lists. See the
    # header of rls-write-paths.integration.test.ts and docs/LEARNINGS.md.
    #
    services:
      postgres:
        # Matches compose.yaml. The suite reads pg_class/pg_policies and uses
        # DROP DATABASE ... WITH (FORCE), so the major version is not incidental.
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        # Container port only: Docker picks a free host port, so two integration
        # jobs on one self-hosted host (or its own Postgres) cannot collide.
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # Matches compose.yaml. turn-coordination-bus.integration.test.ts runs
        # the cross-replica Stop, replay, and trimming paths against it.
        image: redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      # The DSN is a SUPERUSER connection to the server, not to a fixed
      # database: the suite creates a throwaway database per run, migrates it,
      # creates `app_user` through the same code path `pnpm db:migrate` uses,
      # and drops it in teardown. Without INTEGRATION_DATABASE_URL the whole
      # project skips, which is what keeps `pnpm test:all` green elsewhere.
      #
      # The Redis suite skips without INTEGRATION_REDIS_URL for the same reason.
      # INTEGRATION_REQUIRE_REDIS makes a missing URL fail here instead.
      - run: pnpm test:integration
        env:
          INTEGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres
          INTEGRATION_REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}
          INTEGRATION_REQUIRE_REDIS: '1'
      # Advisory trend, never a gate. The blocking floor in the `test` job
      # measures the unit suite alone, so a store whose only tests need Postgres
      # reports near zero there: project-store.ts reads 4.1% while this suite
      # covers every line. This step prints both numbers so the real figure is
      # visible without making the threshold depend on a database.
      #
      # It runs the unit coverage pass too, because the merge needs both
      # reports and jobs do not share a filesystem.
      - name: Unit + integration coverage trend
        continue-on-error: true
        run: pnpm test:coverage && pnpm test:coverage:merged
        env:
          INTEGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:${{ job.services.postgres.ports['5432'] }}/postgres
          INTEGRATION_REDIS_URL: redis://localhost:${{ job.services.redis.ports['6379'] }}

  license-check:
    name: License check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-workspace
      - run: pnpm license:check
