# Cogniplane Core — single-host self-host stack.
#
# This file is intended for OSS self-hosters who want to run the full platform
# on one machine via `docker compose up`. It boots Postgres + Redis + the
# backend + the frontend with sensible defaults (AUTH_MODE=dev-headers).
#
# Required env vars (export before `docker compose up`, or put in a .env file):
#   E2B_API_KEY        — required at boot; the runtime executes inside E2B
#   E2B_TEMPLATE_ID    — required at boot; run `make e2b-build` to create one
#   ANTHROPIC_API_KEY  — optional at boot; required for Anthropic model turns
# E2B_API_KEY / E2B_TEMPLATE_ID are required for the backend to boot at all.
#
# After bring-up:
#   Frontend: http://localhost:3000
#   Backend:  http://localhost:3001
#
# Production caveats:
#   - dev-headers mode reads X-User-Id from the request — never expose this
#     stack to the internet without first switching AUTH_MODE=workos.
#   - See docs/docker-deploy.md for the full walkthrough.

services:
  exposure-guard:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_BIND_ADDR: ${POSTGRES_BIND_ADDR:-127.0.0.1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-local-dev-app-user-password}
      DEV_HEADERS_AUTH_KEY: ${DEV_HEADERS_AUTH_KEY:-local-dev-headers-auth-key}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$${POSTGRES_BIND_ADDR}" in
          127.0.0.1|localhost|::1) exit 0 ;;
        esac
        if [ "$${POSTGRES_PASSWORD}" = postgres ] ||
           [ "$${APP_USER_PASSWORD}" = local-dev-app-user-password ] ||
           [ "$${DEV_HEADERS_AUTH_KEY}" = local-dev-headers-auth-key ]; then
          echo "Refusing a non-loopback Postgres bind while local default credentials are active." >&2
          exit 1
        fi

  redis:
    image: redis:7.4.7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    container_name: cogniplane-redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    container_name: cogniplane-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    environment:
      POSTGRES_DB: cogniplane
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      exposure-guard:
        condition: service_completed_successfully
    ports:
      - "${POSTGRES_BIND_ADDR:-127.0.0.1}:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cogniplane"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: cogniplane-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=1g
      - /home/appuser:mode=0755,uid=1001,gid=1001,size=64m
    mem_limit: 3g
    cpus: 2.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      API_ORIGIN: http://localhost:3000
      AUTH_MODE: dev-headers
      # dev-headers lets anyone who can reach the port impersonate any user/tenant
      # via X-User-Id. API_HOST must be 0.0.0.0 *inside* the container (Docker
      # bridge networking requires it), which the loopback guard rejects — hence
      # the opt-in. The real exposure control is the host port publish bound to
      # 127.0.0.1 above, so the backend is reachable only from the host. To expose
      # it on a network, switch AUTH_MODE=workos (and drop this opt-in) first.
      COGNIPLANE_ALLOW_DEV_HEADERS_ON_NON_LOOPBACK: "1"
      # Request-level guard the opt-in makes mandatory: identity headers are
      # ignored unless the caller also presents this key. Override for anything
      # beyond a laptop.
      DEV_HEADERS_AUTH_KEY: ${DEV_HEADERS_AUTH_KEY:-local-dev-headers-auth-key}
      DATABASE_URL: postgres://app_user:${APP_USER_PASSWORD:-local-dev-app-user-password}@postgres:5432/cogniplane
      MIGRATION_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/cogniplane
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-local-dev-app-user-password}
      LOCAL_DEV_USER_ID: local-dev-user
      REDIS_URL: redis://redis:6379
      # Forwarded from host env / .env when non-empty. E2B_* are required at
      # boot (config.ts fails fast); the Anthropic key is optional at boot (turns need it).
      E2B_API_KEY:
      E2B_TEMPLATE_ID:
      ANTHROPIC_API_KEY:
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # NEXT_PUBLIC_* vars are baked at build time. The defaults work for
        # local docker-compose on the same host. To deploy under a different
        # hostname, override these args (and rebuild) and set API_ORIGIN on
        # the backend to match.
        NEXT_PUBLIC_API_URL: http://localhost:3001
        NEXT_PUBLIC_DEV_USER_ID: local-dev-user
        NEXT_PUBLIC_DEV_TENANT_ID: local-dev-tenant
        NEXT_PUBLIC_DEV_AUTH_KEY: ${DEV_HEADERS_AUTH_KEY:-local-dev-headers-auth-key}
        # This explicit opt-in is confined to the loopback-only local stack.
        COGNIPLANE_ALLOW_DEV_AUTH_IN_PRODUCTION_BUILD: "1"
    container_name: cogniplane-frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=256m
      - /home/node:mode=0755,uid=1000,gid=1000,size=64m
      - /app/.wrangler:mode=0755,uid=1000,gid=1000,size=64m
      - /app/apps/frontend/.next/cache:mode=0755,uid=1000,gid=1000,size=256m
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  redis-data:
  postgres-data:
