      tags: [Admin - Runtime]
      summary: List recent runtime sessions
      description: Returns the 100 most recent runtime sessions with a human-readable config summary.
      responses:
        "200":
          description: Runtime sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  runtimeSessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/RuntimeSession'
                required: [runtimeSessions]
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /admin/diagnostics:
    get:
      operationId: adminGetDiagnostics
      tags: [Admin - Runtime]
      summary: Backend build, uptime and runtime activity
      description: |
        Operator detail that the public health endpoints do not return. Runtime
        counts cover the caller's organization only.
      responses:
        "200":
          description: Diagnostics
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  uptimeSeconds:
                    type: integer
                    example: 3600
                  version:
                    type: object
                    properties:
                      sha:
                        type: string
                        description: Build commit, or `dev` when the build is not stamped.
                      buildDate:
                        type: string
                        description: Build timestamp, or an empty string when the build is not stamped.
                    required: [sha, buildDate]
                  runtimes:
                    type: object
                    properties:
                      activeRuntimeCount:
                        type: integer
                      activeTurnCount:
                        type: integer
                    required: [activeRuntimeCount, activeTurnCount]
                required: [status, uptimeSeconds, version, runtimes]
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /admin/runtime-sessions/rollout:
    post:
      operationId: adminRolloutRuntimeSessions
      tags: [Admin - Runtime]
      summary: Execute a runtime rollout
      description: |
        Triggers a rollout action on idle runtime sessions.

        - `drain_idle` — shut down idle runtimes without replacing them
        - `refresh_idle` — replace idle runtimes with a fresh instance using the latest config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [drain_idle, refresh_idle]
              required: [action]
      responses:
        "200":
          description: Rollout executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  action:
                    type: string
                    enum: [drain_idle, refresh_idle]
                  affectedSessionIds:
                    type: array
                    items:
                      type: string
                required: [action, affectedSessionIds]
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
