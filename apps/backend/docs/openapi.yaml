      operationId: adminCleanupSkillRevisions
      tags: [Admin - Skills]
      summary: Clean up inactive skill revisions
      description: |
        Deletes inactive revisions and their stored bundles to reclaim storage.
        Use `dryRun: true` to preview what would be deleted without making any changes.
      requestBody:
