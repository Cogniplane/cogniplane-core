  # -------------------------------------------------------------------------
  # MCP gateway
  # -------------------------------------------------------------------------
  /mcp/{serverId}:
    post:
      operationId: mcpRpc
      tags: [MCP]
      summary: MCP JSON-RPC endpoint
      description: |
        Implements a subset of the [Model Context Protocol](https://spec.modelcontextprotocol.io) (2025-03-26)
        over HTTP JSON-RPC 2.0.

        **Supported methods**

        | Method | Description |
        |---|---|
        | `initialize` | Handshake — returns server capabilities and version |
        | `notifications/initialized` | Acknowledge init — returns HTTP 202 with no body |
        | `tools/list` | Enumerate available tools |
        | `tools/call` | Invoke a tool |

        For `managed` servers tools are executed in-process.
        For `proxy` servers the RPC is forwarded to the configured upstream URL.

        All `tools/call` requests must include `params.arguments.toolContextId`.
      parameters:
        - name: serverId
          in: path
          required: true
          description: Server ID as registered via `POST /admin/mcp-servers`
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonRpcRequest'
      responses:
        "200":
          description: JSON-RPC response (success or application-level error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
        "202":
          description: Notification acknowledged (`notifications/initialized`). No response body.
        "400":
          description: Malformed JSON-RPC envelope (not a valid JSON-RPC 2.0 request)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonRpcResponse'
        "401":
          $ref: '#/components/responses/Unauthorized'

