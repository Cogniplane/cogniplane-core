                  description: ZIP file containing the skill bundle
              required: [file]
            encoding:
              file:
                contentType: application/zip
      responses:
        "201":
          description: Skill bundle imported and activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillImportResult'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "413":
          description: Archive exceeds the configured size limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
