    post:
      operationId: adminImportSkillFromGithub
      tags: [Admin - Skills]
      summary: Import skill bundle from GitHub
      description: Fetches a skill bundle directly from a GitHub repository and imports it as a new revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                githubUrl:
                  type: string
                  format: uri
                  description: HTTPS URL of the GitHub repository. Must use `https://`.
                ref:
                  type: string
                  maxLength: 200
                  description: Branch, tag, or commit SHA. Defaults to the repository's default branch.
                subdirectory:
                  type: string
                  maxLength: 300
                  description: Path within the repository to the skill bundle root. Defaults to repository root.
              required: [githubUrl]
      responses:
        "201":
          description: Skill bundle imported and activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillImportResult'
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

